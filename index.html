<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Wedding Invitation</title>

    <style>

        /* =========================
           BASIC
        ========================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;
        }


        /* =========================
           OPENING SCREEN
        ========================= */

        #opening {
            position: fixed;
            inset: 0;
            z-index: 10000;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #f3eadb 0%,
                    #e6d7c1 55%,
                    #d6c1a5 100%
                );

            transition:
                opacity 1.2s ease,
                visibility 1.2s ease;
        }


        /* =========================
           PAPER SHADOW
        ========================= */

        .card-wrapper {
            position: relative;

            width: min(330px, 78vw);
            height: min(470px, 70vh);

            display: flex;
            align-items: center;
            justify-content: center;

            perspective: 1200px;

            filter:
                drop-shadow(
                    0 25px 30px rgba(60, 42, 25, 0.28)
                );
        }


        /* =========================
           KRAFT CARD
        ========================= */

        .kraft-card {

            position: relative;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    135deg,
                    #d2ae7b,
                    #c39a65 45%,
                    #b98c57
                );

            border-radius: 3px;

            border: 1px solid rgba(90, 60, 30, 0.35);

            overflow: hidden;

            transform-style: preserve-3d;

            transition:
                transform 1.4s cubic-bezier(.2,.8,.2,1),
                opacity 1.2s ease;
        }


        /* Paper texture */

        .kraft-card::before {

            content: "";

            position: absolute;
            inset: 0;

            opacity: 0.18;

            background-image:
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,.15) 0px,
                    rgba(255,255,255,.15) 1px,
                    transparent 1px,
                    transparent 4px
                ),
                repeating-linear-gradient(
                    90deg,
                    rgba(80,50,20,.08) 0px,
                    rgba(80,50,20,.08) 1px,
                    transparent 1px,
                    transparent 5px
                );

            pointer-events: none;
        }


        /* Inner border */

        .kraft-card::after {

            content: "";

            position: absolute;

            inset: 18px;

            border: 1px solid rgba(80, 52, 28, 0.42);

            pointer-events: none;
        }


        /* =========================
           CARD CONTENT
        ========================= */

        .card-content {

            position: absolute;

            inset: 0;

            z-index: 2;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            color: #4a321f;

            padding: 45px;
        }


        .small-text {

            font-size: 11px;

            letter-spacing: 4px;

            text-transform: uppercase;

            margin-bottom: 22px;

            opacity: .8;
        }


        .title {

            font-size: clamp(30px, 8vw, 42px);

            font-weight: normal;

            letter-spacing: 2px;

            line-height: 1.15;

            margin: 0;
        }


        .subtitle {

            margin-top: 16px;

            font-size: 13px;

            letter-spacing: 3px;

            text-transform: uppercase;

            opacity: .8;
        }


        /* =========================
           OPEN BUTTON
        ========================= */

        .open-button {

            margin-top: 55px;

            padding: 14px 27px;

            background: transparent;

            border: 1px solid rgba(74, 50, 31, .65);

            color: #4a321f;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 11px;

            letter-spacing: 3px;

            cursor: pointer;

            transition:
                background .3s ease,
                color .3s ease,
                transform .3s ease;
        }


        .open-button:hover {

            background: #4a321f;

            color: #ead9bd;

            transform: translateY(-2px);
        }


        /* =========================
           OPEN ANIMATION
        ========================= */

        #opening.opening-active .kraft-card {

            transform:
                rotateY(180deg)
                scale(1.12);

            opacity: 0;
        }


        #opening.opening-active {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }


        /* =========================
           CANVA
        ========================= */

        #canva-container {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background: white;

            opacity: 0;

            transform: scale(1.03);

            transition:
                opacity 1.3s ease,
                transform 1.3s ease;
        }


        #canva-container.visible {

            opacity: 1;

            transform: scale(1);
        }


        #canva {

            position: absolute;

            width: 100%;
            height: 100%;

            top: 0;
            left: 0;

            border: none;

            display: block;
        }


        /* =========================
           MUSIC BUTTON
        ========================= */

        #music-button {

            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 9999;

            width: 45px;
            height: 45px;

            border-radius: 50%;

            border: none;

            background: rgba(255,255,255,.92);

            box-shadow:
                0 4px 15px rgba(0,0,0,.18);

            font-size: 18px;

            cursor: pointer;

            opacity: 0;

            transition:
                opacity .5s ease,
                transform .3s ease;
        }


        #music-button.visible {

            opacity: 1;
        }


        #music-button:hover {

            transform: scale(1.08);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .card-wrapper {

                width: 76vw;

                height: 108vw;

                max-height: 600px;
            }

            .card-content {

                padding: 35px;
            }

            .small-text {

                font-size: 9px;

                letter-spacing: 3px;
            }

            .subtitle {

                font-size: 10px;

                letter-spacing: 2px;
            }

            .open-button {

                margin-top: 40px;
            }
        }

    </style>
</head>


<body>


    <!-- ==================================
         OPEN INVITATION SCREEN
    ================================== -->

    <div id="opening">

        <div class="card-wrapper">

            <div class="kraft-card">

                <div class="card-content">

                    <div class="small-text">
                        Together with their families
                    </div>

                    <h1 class="title">
                        Our<br>
                        Wedding
                    </h1>

                    <div class="subtitle">
                        Invitation
                    </div>

                    <button
                        class="open-button"
                        onclick="openInvitation()">
                        OPEN INVITATION
                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- ==================================
         CANVA WEBSITE
    ================================== -->

    <div id="canva-container">

        <iframe
            id="canva"
            src="https://www.canva.com/design/DAHTjD7R15Q/T8raJw4D5LSIhi0KsgIwBg/view?embed"
            allowfullscreen>
        </iframe>

    </div>



    <!-- ==================================
         MUSIC
    ================================== -->

    <audio
        id="music"
        loop
        preload="auto">

        <source
            src="wedding-song.mp3"
            type="audio/mpeg">

    </audio>



    <!-- MUSIC CONTROL -->

    <button
        id="music-button"
        onclick="toggleMusic()">

        🔊

    </button>



    <!-- ==================================
         JAVASCRIPT
    ================================== -->

    <script>

        const opening =
            document.getElementById("opening");

        const canvaContainer =
            document.getElementById("canva-container");

        const music =
            document.getElementById("music");

        const musicButton =
            document.getElementById("music-button");


        function openInvitation() {

            /*
             * QUAN TRỌNG:
             * play() được gọi trực tiếp
             * khi người dùng click.
             * Vì vậy trình duyệt cho phép
             * phát nhạc.
             */

            music.play().then(function () {

                musicButton.textContent = "🔊";

            }).catch(function (error) {

                console.log(
                    "Music could not start:",
                    error
                );

            });


            /*
             * Bắt đầu animation chiếc thiệp
             */

            opening.classList.add(
                "opening-active"
            );


            /*
             * Sau khoảng 700ms,
             * bắt đầu hiện Canva
             */

            setTimeout(function () {

                canvaContainer.classList.add(
                    "visible"
                );

            }, 650);


            /*
             * Hiện nút điều khiển nhạc
             */

            setTimeout(function () {

                musicButton.classList.add(
                    "visible"
                );

            }, 1200);

        }


        function toggleMusic() {

            if (music.paused) {

                music.play();

                musicButton.textContent = "🔊";

            } else {

                music.pause();

                musicButton.textContent = "🔇";

            }

        }

    </script>


</body>
</html>
